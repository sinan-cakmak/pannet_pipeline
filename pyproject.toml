[project]
name = "pannet-pipeline"
version = "0.1.0"
description = "End-to-end bipartite GNN pipeline for PanNET infiltration pattern scoring"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Deep learning (torch 2.4.x for CUDA 12.0 compatibility on HPC)
    "torch>=2.4.0,<2.5",
    "torchvision>=0.19.0,<0.20",
    "torch-geometric>=2.6.0",
    "lightning>=2.4.0,<2.5",
    "torchmetrics>=1.4.0,<1.7",
    # Data
    "h5py>=3.11.0",
    "scipy>=1.14.0",
    "networkx>=3.3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    # ML utilities
    "scikit-learn>=1.5.0",
    "torchmetrics>=1.4.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Stage 1: WSI processing (also needed by Trident)
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "huggingface-hub>=0.20.0",
    "opencv-python>=4.9.0",
    "openslide-python>=1.3.0",
    # Output
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
    "python-pptx>=1.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch Geometric: install from PyPI (has CPU wheels).
# On HPC with CUDA, install PyG CUDA extensions separately:
#   uv pip install pyg-lib torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.4.0+cu121.html

# Trident (WSI preprocessing): install separately as editable local package.
# It uses Poetry and has a strict Python <3.12 constraint that can be ignored.
#   cd /path/to/pannet_pipeline
#   uv pip install -e ../trident --no-build-isolation
