[project]
name = "pannet-pipeline"
version = "0.1.0"
description = "End-to-end bipartite GNN pipeline for PanNET infiltration pattern scoring"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Deep learning
    "torch>=2.8.0",
    "torch-geometric>=2.7.0",
    "lightning>=2.6.1",
    # Data
    "h5py>=3.11.0",
    "scipy>=1.14.0",
    "networkx>=3.3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    # ML utilities
    "scikit-learn>=1.5.0",
    "torchmetrics>=1.4.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Output
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch Geometric: install from PyPI (has CPU wheels).
# On HPC with CUDA, install PyG CUDA extensions separately:
#   uv pip install pyg-lib torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.8.0+cu129.html
